name: e2e regression (iOS)

# Runs the HOF Golf regression test (tests/hof-golf-regression.e2e.ts) on an
# iOS Simulator on the EAS macOS worker, then comments the result on the PR.
#
# Does not run on every push. It starts when a PR gets the `e2e-regression`
# label. The workflow removes the label when it ends, so add it again to rerun.
# To run it by hand:
#   npx eas-cli@latest workflow:run .eas/workflows/e2e-regression.yaml
#
# Agent steps replay from the committed .e2e/cache with no model call. A step
# that cannot replay calls Claude through a GitHub Copilot login: the
# E2E_OAUTH_CREDENTIALS secret in the preview EAS environment holds a copy of
# ~/.config/e2e/oauth.json. When that login expires, the run fails with
# LOGIN_REQUIRED: run `npx e2e login github-copilot` and update the secret.

on:
  pull_request_labeled:
    labels: ['e2e-regression']
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  # The test needs a release build of the preview variant with this commit's
  # JS in it. If an e2e-ios-simulator build has the same native fingerprint,
  # repack it with the new JS (fast). Otherwise, make a full build.
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview # APP_VARIANT=preview, as in the e2e-ios-simulator profile

  get_build:
    name: Find a build with the same fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      platform: ios
      profile: e2e-ios-simulator

  repack_ios:
    name: Repack with this commit's JS
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    type: repack
    params:
      build_id: ${{ needs.get_build.outputs.build_id }}

  build_ios:
    name: Build iOS Simulator app
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: e2e-ios-simulator

  e2e_ios:
    name: Run e2e regression on iOS
    # One of repack_ios and build_ios is skipped; run after whichever ran
    after: [repack_ios, build_ios]
    if: ${{ after.repack_ios.status == 'success' || after.build_ios.status == 'success' }}
    runs_on: macos-medium
    image: sdk-58 # Node.js 22 (e2e needs 22.12 or later)
    environment: preview
    steps:
      - uses: eas/checkout

      - uses: eas/install_node_modules

      - uses: eas/download_build
        id: download_build
        with:
          build_id: ${{ after.repack_ios.outputs.build_id || after.build_ios.outputs.build_id }}
          extensions: [app]

      # The .e2e/cache steps were recorded on an EAS Simulator iPhone 17. On
      # another device the replay can miss, and on the worker's iPhone 18 Pro
      # the team picker sheet reported its rows as covered. Prefer an iPhone 17.
      # e2e drives whichever simulator is booted, so shut down the others first.
      - name: Boot a simulator and install the app
        run: |
          xcrun simctl list devices available --json > /tmp/devices.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/devices.json", "utf8")).devices;
            for (const [runtime, list] of Object.entries(d))
              for (const x of list) if (x.name.startsWith("iPhone")) console.log(`  ${x.name}  ${runtime.split(".").pop()}  ${x.state}`);
          '
          UDID=$(node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/devices.json", "utf8")).devices;
            const all = Object.values(d).flat().filter((x) => x.name.startsWith("iPhone"));
            const pick = all.find((x) => x.name === "iPhone 17") ?? all[0];
            console.log(pick.udid);
          ')
          echo "Using $(xcrun simctl list devices | grep "$UDID")"
          xcrun simctl shutdown all
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "${{ steps.download_build.outputs.artifact_path }}"

      - name: Run e2e
        run: npx e2e run tests/hof-golf-regression.e2e.ts --config e2e.ci.config.ts --video

      - uses: eas/upload_artifact
        if: ${{ always() }}
        with:
          type: other
          name: e2e-report
          path: |
            .e2e/report.json
            .e2e/artifacts/**/*

  comment:
    name: Comment on PR
    after: [e2e_ios]
    if: ${{ github.event.pull_request.number }}
    type: github-comment
    params:
      payload: |
        ## e2e regression (iOS): `${{ after.e2e_ios.status }}`

        HOF Golf fixed route from the 1997 Tigers, expected score 16.

        [Workflow run](${{ workflow.url }}) · the report, the video, and failure screenshots are under **Artifacts**.

  # Remove the label, so adding it again starts a new run
  remove_label:
    name: Remove the e2e-regression label
    after: [e2e_ios, comment]
    if: ${{ github.event.pull_request.number }}
    environment: preview # GH_TOKEN
    steps:
      - uses: eas/checkout
      - uses: ./.eas/functions/remove-pr-label
        with:
          label: e2e-regression
